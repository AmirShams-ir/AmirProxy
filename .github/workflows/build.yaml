name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Build
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip file git openjdk-17-jdk

          git submodule foreach git submodule update --init

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          mkdir sdk
          unzip -q commandlinetools-linux-13114758_latest.zip -d sdk

          export ANDROID_HOME=$PWD/sdk
          export ANDROID_SDK_ROOT=$PWD/sdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          yes | sdk/cmdline-tools/bin/sdkmanager --sdk_root=$PWD/sdk --licenses

          ./gradlew assembleRelease

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ref_name="pr-${{ github.event.pull_request.number }}"
          else
            ref_name="${{ github.ref_name }}"
          fi

          echo "ref_name=$ref_name" >> $GITHUB_ENV

          cp app/build/outputs/apk/release/*.apk \
             AmirProxy-${ref_name}-release.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AmirProxy-${{ env.ref_name }}-release.apk
          path: AmirProxy-${{ env.ref_name }}-release.apk
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "AmirProxy-*"
          merge-multiple: true

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/AmirProxy-*; do
            gh release upload ${{ github.event.release.tag_name }} "$i"
          done
